name: xss-elgg-cyberrange

hosts:
  - name: attacker
    base_box:
      image: seed
      mgmt_user: seed
    flavor: m1.medium

  - name: web-server
    base_box:
      image: seed
      mgmt_user: seed
    flavor: m1.medium
routers:
  - name: router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.small

wan:
  name: internet-connection
  cidr: 100.100.100.0/24

networks:
  - name: target-switch
    cidr: 10.20.10.0/24
    accessible_by_user: False

  - name: attacker-switch
    cidr: 10.20.20.0/24

net_mappings:
  - host: attacker
    network: attacker-switch
    ip: 10.20.20.10

  - host: web-server
    network: target-switch
    ip: 10.20.10.10

router_mappings:
  - router: router
    network: target-switch
    ip: 10.20.10.1

  - router: router
    network: attacker-switch
    ip: 10.20.20.1

groups: []
