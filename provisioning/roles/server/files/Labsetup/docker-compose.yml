version: "3"

services:
  elgg:
    build: ./image_www
    image: cyberrange-xss-elgg
    container_name: elgg
    tty: true
    ports:
      - "80:80"
    depends_on:
      - mysql
    networks:
      net-elgg:
        ipv4_address: 10.9.0.5

  mysql:
    build: ./image_mysql
    image: cyberrange-xss-mysql
    container_name: mysql
    command: --default-authentication-plugin=mysql_native_password
    tty: true
    restart: always
    cap_add:
      - SYS_NICE
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      net-elgg:
        ipv4_address: 10.9.0.6

networks:
  net-elgg:
    name: cyberrange-xss-net
    ipam:
      config:
        - subnet: 10.9.0.0/24
